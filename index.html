<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Quest · Sat</title>
<style>
:root{
  --bg:#141826; --bg2:#1d2236; --ink:#F4F1EA; --soft:#B9BED0; --gold:#F2B33D;
  --blue:#3D8BFD; --orange:#FF8A3D; --green:#3CC47C; --red:#F0546A;
  --panel:rgba(20,24,38,.88); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Nunito",-apple-system,"PingFang SC",sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
.arena{position:fixed;inset:0;background:
  radial-gradient(ellipse at 50% 115%,rgba(242,179,61,.28),transparent 55%),
  radial-gradient(ellipse at 15% 0%,rgba(61,139,253,.22),transparent 50%),
  radial-gradient(ellipse at 90% 10%,rgba(240,84,106,.18),transparent 45%),
  linear-gradient(180deg,#10131f,#1b2033 60%,#231d1a)}
/* court lines */
.arena svg{position:absolute;inset:0;width:100%;height:100%;opacity:.13}
.view{position:fixed;inset:0;display:none}
.view.on{display:block}

/* ---------- hub ---------- */
.top{position:absolute;top:22px;left:0;right:0;text-align:center}
.top h1{font-size:clamp(28px,4vw,48px);letter-spacing:1px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.top h1 b{color:var(--gold)}
.top p{color:var(--soft);font-size:15px}
.fan{position:absolute;left:50%;top:52%;width:0;height:0}
.card{position:absolute;width:170px;height:236px;left:-85px;top:-150px;border-radius:22px;border:5px solid #fff;
  box-shadow:0 14px 34px rgba(0,0,0,.45);transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s;
  display:flex;flex-direction:column;align-items:center;padding:12px 10px;color:#fff;text-align:center;overflow:hidden}
.card:hover,.card.sel{z-index:20;box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 4px var(--gold)}
.card .no{align-self:flex-start;font-weight:800;font-size:26px;line-height:1}
.card .emb{width:86px;height:86px;margin:2px 0 4px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.card h3{font-size:21px;line-height:1.1;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .tm{font-size:14px;opacity:.95;margin-top:3px}
.card .hero{font-size:12px;opacity:.85;letter-spacing:.5px}
.card .done{position:absolute;top:8px;right:10px;font-size:22px;display:none}
.card.isdone .done{display:block}
.c1{background:linear-gradient(160deg,#FF8A5B,#E2553A)}
.c2{background:linear-gradient(160deg,#A77BEA,#6C48C9)}
.c3{background:linear-gradient(160deg,#F25C8A,#C3366A)}
.c4{background:linear-gradient(160deg,#F2B33D,#C98A1A)}
.c5{background:linear-gradient(160deg,#3CC4B4,#1F8F8A)}
.c6{background:linear-gradient(160deg,#4FA3F2,#2C6CC4)}
.c7{background:linear-gradient(160deg,#6CC24A,#3E8B2C)}
.c8{background:linear-gradient(160deg,#F5C842,#E09B1E)}
.info{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(980px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 18px;display:flex;gap:16px;align-items:center;backdrop-filter:blur(8px)}
.info .ic{width:66px;height:66px;border-radius:16px;flex:none;display:grid;place-items:center}
.info .ic svg{width:52px;height:52px}
.info h2{font-size:24px}
.info p{color:var(--soft);font-size:14px}
.info .grow{flex:1;min-width:0}
.go{background:var(--gold);color:#2a1d05;font-weight:800;font-size:20px;padding:12px 22px;border-radius:14px;white-space:nowrap}
.go:hover{filter:brightness(1.08)}
.decks{display:inline-flex;gap:6px;margin-top:8px;background:rgba(0,0,0,.3);padding:5px;border-radius:999px}
.decks button{padding:6px 16px;border-radius:999px;background:transparent;color:var(--soft);font-weight:800}
.decks button.on{background:var(--gold);color:#2a1d05}
.card.off{display:none}
.cb1{background:linear-gradient(160deg,#FF7A7A,#C93F55)}
.cb2{background:linear-gradient(160deg,#5ED1E8,#2A8FB8)}
.cb3{background:linear-gradient(160deg,#B28DFF,#7A52D6)}
.cb4{background:linear-gradient(160deg,#FFB65C,#E07A1F)}
.cb5{background:linear-gradient(160deg,#5A6378,#252B3B)}
.film{width:100%;max-height:62vh;border-radius:14px;background:#000;display:block}
.fzb.got{background:rgba(60,196,124,.35);border-color:var(--green)}
/* forge */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:14px;font-size:22px;font-weight:800;background:rgba(61,139,253,.18);border:2px solid #7DB6FF;color:#CFE3FF}
.chip.s{background:rgba(255,138,61,.18);border-color:#FFA463;color:#FFD9BF}
.chip.pick{outline:4px solid var(--gold)}
.chip.used{opacity:.35}
.anvil{min-height:90px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:clamp(34px,5vw,56px);font-weight:900;margin:14px 0;border-radius:18px;background:rgba(0,0,0,.25)}
.anvil.bad{animation:shake .35s}
.forged{display:flex;flex-wrap:wrap;gap:8px}
.forged span{padding:4px 12px;border-radius:999px;background:rgba(60,196,124,.2);font-weight:800}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:900px}
.mc{height:120px;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.mc.up,.mc.got{transform:rotateY(180deg)}
.mc>div{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;font-weight:800;font-size:20px;text-align:center;padding:6px}
.mc .bk{background:linear-gradient(160deg,#5ED1E8,#2A8FB8);border:3px solid #fff}
.mc .fr{background:#232a42;border:3px solid var(--line);transform:rotateY(180deg)}
.mc.got .fr{border-color:var(--green);background:rgba(60,196,124,.2)}
.mc .fr svg{width:100%;height:100%}
/* quick draw / adverb */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.qa button{padding:16px 8px;font-size:22px;font-weight:800;border-radius:14px;background:rgba(255,255,255,.08);color:var(--ink);border:2px solid var(--line)}
.qa button.right{background:rgba(60,196,124,.3);border-color:var(--green)}
.qa button.wrong{background:rgba(240,84,106,.25);border-color:var(--red);animation:shake .35s}
.tbar{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;background:var(--gold);width:100%}
.sent{font-size:clamp(26px,3.6vw,42px);font-weight:800;line-height:1.35;margin:10px 0}
.sent .gap{display:inline-block;min-width:150px;border-bottom:4px solid var(--gold);color:var(--gold);text-align:center}

/* ---------- round ---------- */
.round{position:absolute;inset:16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.rhead .ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;flex:none}
.rhead .ic svg{width:42px;height:42px}
.rhead h2{font-size:26px;line-height:1.1}
.rhead p{color:var(--soft);font-size:14px}
.rhead .grow{flex:1}
.btn{background:rgba(255,255,255,.1);color:var(--ink);padding:9px 14px;border-radius:12px;border:1px solid var(--line);font-weight:700}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.gold{background:var(--gold);color:#2a1d05;border:0}
.rbody{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.rfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:14px}
.rfoot .lbl{color:var(--soft)}
.sup{display:flex;gap:6px}
.sup button{width:40px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--ink);font-weight:800;border:1px solid var(--line)}
.sup button.on{background:var(--gold);color:#2a1d05}
.notes{display:none;background:#fff8ea;color:#3a2a10;border-radius:14px;padding:12px 16px;font-size:14.5px;line-height:1.6}
.notes.on{display:block}
.notes b{color:#a0520f}

/* shared bits */
.big{font-size:clamp(26px,3.4vw,40px);font-weight:800;line-height:1.25}
.q{font-size:clamp(24px,3vw,34px);font-weight:800}
.frame{display:inline-block;background:rgba(242,179,61,.14);border:2px dashed var(--gold);border-radius:14px;padding:10px 16px;font-size:clamp(20px,2.4vw,28px);margin:6px 0}
.blank{display:inline-block;min-width:120px;border-bottom:3px solid var(--gold)}
.grid{display:grid;gap:14px}
.tile{background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;transition:transform .2s,border-color .2s,background .2s}
.tile:hover{transform:translateY(-3px)}
.tile.pick{border-color:var(--gold);background:rgba(242,179,61,.15)}
.step{display:flex;gap:14px;align-items:flex-start;margin:12px 0;opacity:.35;transition:opacity .3s}
.step.on{opacity:1}
.step .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:800;font-size:20px}
.hide{display:none!important}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.root{color:#7DB6FF}
.suf{color:#FFA463}
.small{font-size:13px;color:var(--soft)}

/* words */
.wrow{display:grid;grid-template-columns:1fr 60px 1.4fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.word{font-size:clamp(24px,3vw,36px);font-weight:800;letter-spacing:1px;cursor:pointer;border-radius:10px;padding:2px 8px;display:inline-flex;align-items:center;gap:8px}
.word.ok{background:rgba(60,196,124,.22)}
.word.no{background:rgba(240,84,106,.18)}
.word .cut{display:inline-block;width:0;overflow:hidden;color:#fff;transition:width .3s}
.split .word .cut{width:.5em}
.part{display:inline-block;transition:transform .35s,color .35s}
.split .part.r{color:#7DB6FF;transform:translateX(-4px)}
.split .part.s{color:#FFA463;transform:translateX(6px)}
.arrow{color:var(--soft);font-size:26px;text-align:center}
.score{font-size:22px;font-weight:800}
.score b{color:var(--gold);font-size:30px}

/* angles */
.figs{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fig{cursor:pointer;position:relative}
.fig svg{width:100%;height:110px}
.fig .lt{position:absolute;top:8px;left:12px;font-weight:800;font-size:20px;color:var(--gold)}
.fig.right{border-color:var(--green);background:rgba(60,196,124,.18)}
.fig.wrong{border-color:var(--red);animation:shake .35s}
.fig.glow{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,179,61,.4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say{font-size:clamp(30px,4vw,48px);font-weight:800;color:var(--gold);min-height:1.3em}
.dial{display:grid;grid-template-columns:minmax(260px,1.1fr) 1fr;gap:22px;align-items:center}
.dial svg{width:100%;max-height:58vh}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}
.deg{font-size:clamp(40px,6vw,72px);font-weight:900;color:var(--gold);line-height:1}
.aname{font-size:clamp(26px,3.4vw,40px);font-weight:800;min-height:1.3em}

/* break */
.timer{font-size:clamp(60px,10vw,120px);font-weight:900;color:var(--gold);text-align:center;line-height:1}
.court{width:100%;height:46vh;display:block;cursor:crosshair}

/* oath */
.rules{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.rule{transform:rotateY(90deg);transition:transform .5s;text-align:left}
.rule.on{transform:none}
.rule h4{font-size:22px;margin-bottom:4px}
.stamp{display:inline-block;border:5px solid var(--red);color:var(--red);font-weight:900;font-size:34px;padding:4px 18px;border-radius:12px;transform:rotate(-12deg);margin-left:12px}
.agenda{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.agenda span{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700}

/* level up */
.bars{display:grid;grid-template-columns:150px 1fr 70px;gap:10px 14px;align-items:center;font-size:18px}
.bar{height:30px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.num{width:64px;padding:6px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-weight:800;text-align:center}
textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:10px}
.tips{position:fixed;right:18px;top:16px;color:var(--soft);font-size:12.5px}
@media (max-width:760px){
  .mem{grid-template-columns:repeat(3,1fr)}.qa{grid-template-columns:1fr 1fr}
  .card{width:120px;height:170px;left:-60px;top:-110px;border-width:4px;padding:8px}
  .card .emb{width:56px;height:56px}.card h3{font-size:15px}.card .no{font-size:18px}
  .dial{grid-template-columns:1fr}.info{flex-wrap:wrap}.tips{display:none}
  .wrow{grid-template-columns:1fr 30px 1.2fr}
}
</style>
</head>
<body>
<div class="arena">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-width="5">
      <rect x="40" y="40" width="1520" height="820" rx="10"/>
      <line x1="800" y1="40" x2="800" y2="860"/>
      <circle cx="800" cy="450" r="110"/>
      <path d="M40 250 h260 v400 h-260"/><path d="M1560 250 h-260 v400 h260"/>
      <path d="M40 120 a420 420 0 0 1 0 660"/><path d="M1560 120 a420 420 0 0 0 0 660"/>
    </g>
  </svg>
</div>

<!-- ================= HUB ================= -->
<section class="view on" id="hub">
  <div class="top">
    <h1>Hero <b>Quest</b> · Saturday</h1>
    <p>8 rounds · 6:30 – 8:00 · pick a card</p>
    <div class="decks"><button class="on" data-d="main">Main Quest</button><button data-d="bonus">Bonus · Word Power</button></div>
  </div>
  <div class="fan" id="fan"></div>
  <div class="info">
    <div class="ic" id="infoIc"></div>
    <div class="grow">
      <h2 id="infoT"></h2>
      <p id="infoD"></p>
    </div>
    <button class="go" id="goBtn">Enter →</button>
  </div>
  <div class="tips">← → choose · Enter open · B 切换 Bonus · N 老师备注</div>
</section>

<!-- ================= ROUND ================= -->
<section class="view" id="roundView">
  <div class="round">
    <div class="rhead">
      <div class="ic" id="rIc"></div>
      <div class="grow"><h2 id="rT"></h2><p id="rD"></p></div>
      <button class="btn" id="notesBtn">N 备注</button>
      <button class="btn gold" id="doneBtn">★ Done</button>
      <button class="btn" id="backBtn">Cards</button>
    </div>
    <div class="notes" id="notes"></div>
    <div class="rbody" id="rBody"></div>
    <div class="rfoot">
      <span class="lbl">支持程度（3 = 帮助很多 · 0 = 独立）</span>
      <div class="sup" id="sup"></div>
      <span class="lbl" id="supHint"></span>
    </div>
  </div>
</section>

<script>
/* ---------- emblems (original drawings) ---------- */
const E = {
  peach:`<svg viewBox="0 0 100 100"><g transform="translate(50 52)">${[0,72,144,216,288].map(a=>`<ellipse rx="15" ry="25" cy="-20" fill="#FFD1DC" stroke="#fff" stroke-width="3" transform="rotate(${a})"/>`).join('')}<circle r="11" fill="#F2B33D" stroke="#fff" stroke-width="3"/></g></svg>`,
  fan:`<svg viewBox="0 0 100 100"><path d="M50 88 L12 30 Q50 2 88 30 Z" fill="#fff"/><g stroke="#C7B9F0" stroke-width="3">${[-36,-18,0,18,36].map(a=>`<line x1="50" y1="86" x2="50" y2="18" transform="rotate(${a} 50 86)"/>`).join('')}</g><rect x="44" y="80" width="12" height="16" rx="4" fill="#7A4E2D"/></svg>`,
  blade:`<svg viewBox="0 0 100 100"><line x1="22" y1="92" x2="70" y2="20" stroke="#7A4E2D" stroke-width="7" stroke-linecap="round"/><path d="M62 30 Q92 10 84 50 Q78 38 62 30Z" fill="#E8F1FF" stroke="#fff" stroke-width="3"/><circle cx="66" cy="27" r="6" fill="#3CC47C"/></svg>`,
  spear:`<svg viewBox="0 0 100 100"><line x1="14" y1="90" x2="78" y2="20" stroke="#7A4E2D" stroke-width="6" stroke-linecap="round"/><path d="M74 24 L92 6 L86 32 Z" fill="#E8F1FF" stroke="#fff" stroke-width="3"/><circle cx="35" cy="66" r="13" fill="none" stroke="#fff" stroke-width="5"/><line x1="44" y1="76" x2="56" y2="88" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>`,
  ball:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="#FF8A3D" stroke="#fff" stroke-width="4"/><g fill="none" stroke="#5a2a08" stroke-width="3.5"><line x1="12" y1="50" x2="88" y2="50"/><line x1="50" y1="12" x2="50" y2="88"/><path d="M24 22 Q42 50 24 78"/><path d="M76 22 Q58 50 76 78"/></g></svg>`,
  bow:`<svg viewBox="0 0 100 100"><path d="M30 10 Q85 50 30 90" fill="none" stroke="#7A4E2D" stroke-width="7" stroke-linecap="round"/><line x1="30" y1="10" x2="30" y2="90" stroke="#fff" stroke-width="2.5"/><line x1="14" y1="50" x2="88" y2="50" stroke="#fff" stroke-width="4"/><path d="M90 50 L78 42 L78 58Z" fill="#fff"/><path d="M48 50 l-12 0" stroke="#F2B33D" stroke-width="3"/></svg>`,
  shield:`<svg viewBox="0 0 100 100"><path d="M50 8 L86 22 Q86 70 50 92 Q14 70 14 22 Z" fill="#fff"/><path d="M50 72 L50 34 M50 72 L80 72" stroke="#3E8B2C" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 58 a14 14 0 0 1 14 14" fill="none" stroke="#F2B33D" stroke-width="4"/><text x="58" y="48" font-size="16" font-weight="900" fill="#3E8B2C">?</text></svg>`,
  anvil:`<svg viewBox="0 0 100 100"><path d="M18 40 h64 q0 14 -16 18 v14 h10 v10 h-52 v-10 h10 v-14 q-16 -4 -16 -18z" fill="#fff"/><path d="M60 14 l8 8 -22 22 -8 -8z" fill="#FFD166"/><line x1="64" y1="18" x2="80" y2="6" stroke="#7A4E2D" stroke-width="6" stroke-linecap="round"/><g fill="#FFD166"><circle cx="30" cy="28" r="3"/><circle cx="22" cy="34" r="2"/></g></svg>`,
  cards:`<svg viewBox="0 0 100 100"><rect x="14" y="22" width="40" height="56" rx="7" fill="#fff" transform="rotate(-10 34 50)"/><rect x="46" y="22" width="40" height="56" rx="7" fill="#fff" opacity=".9" transform="rotate(10 66 50)"/><text x="30" y="58" font-size="22" font-weight="900" fill="#2A8FB8" transform="rotate(-10 34 50)">?</text><path d="M58 60 L72 60 L72 44" fill="none" stroke="#2A8FB8" stroke-width="4" transform="rotate(10 66 50)"/></svg>`,
  bolt:`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="none" stroke="#fff" stroke-width="5"/><path d="M54 12 L30 56 H48 L42 90 L70 42 H52 Z" fill="#FFD166" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`,
  film:`<svg viewBox="0 0 100 100"><rect x="10" y="22" width="80" height="56" rx="8" fill="#fff"/><rect x="10" y="22" width="80" height="12" fill="#FFD400"/><path d="M42 44 L62 56 L42 68Z" fill="#252B3B"/><text x="16" y="32" font-size="9" font-weight="900" fill="#252B3B">REPLAY</text></svg>`,
  hoop:`<svg viewBox="0 0 100 100"><rect x="56" y="12" width="34" height="26" rx="3" fill="none" stroke="#fff" stroke-width="4"/><ellipse cx="62" cy="42" rx="16" ry="5" fill="none" stroke="#FF8A3D" stroke-width="5"/><path d="M48 44 l4 18 h20 l4 -18" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="24" cy="70" r="14" fill="#FF8A3D" stroke="#fff" stroke-width="3"/><path d="M30 58 Q40 20 56 38" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 5"/></svg>`,

  const [go,st,bs]=[b.lastChild.children[0],b.lastChild.querySelectorAll('b')[0],b.lastChild.querySelectorAll('b')[1]];
  const sv=h(`<svg viewBox="-160 -40 320 190" style="width:100%;max-height:36vh;display:block;margin:10px auto"><g transform="translate(0 130)"><path class="arc" fill="rgba(242,179,61,.28)" stroke="#F2B33D" stroke-width="3"/><line x1="0" y1="0" x2="140" y2="0" stroke="#fff" stroke-width="7" stroke-linecap="round"/><g class="arm"><line x1="0" y1="0" x2="140" y2="0" stroke="#4FA3F2" stroke-width="7" stroke-linecap="round"/></g><circle r="7" fill="#fff"/></g></svg>`);
  b.append(sv);
  const tb=h(`<div class="tbar"><i></i></div>`); b.append(tb);
  const qa=h(`<div class="qa">${names.map(n=>`<button>${n}</button>`).join('')}</div>`); b.append(qa);
  const why=h(`<div class="frame hide pop" style="margin-top:14px;display:block">⭐ How do you know? <br>It is a/an <span class="blank"></span> angle because <span class="blank"></span>. <button class="btn gold" style="margin-left:10px">Go on →</button></div>`); b.append(why);
  let ans=null, streak=0, t0=0, raf=0, live=false, cur=0;
  const kind=a=>a<90?'acute':a===90?'right':a<180?'obtuse':'straight';
  const pickA=()=>{ const r=Math.random(); return r<.3?20+Math.floor(Math.random()*60):r<.5?90:r<.8?100+Math.floor(Math.random()*70):180 };
  const setArm=a=>{ cur=a; sv.querySelector('.arm').setAttribute('transform',`rotate(${-a})`); const R2=50,x=R2*Math.cos(a*Math.PI/180),y=-R2*Math.sin(a*Math.PI/180);
    sv.querySelector('.arc').setAttribute('d',`M0 0 L${R2} 0 A${R2} ${R2} 0 0 0 ${x.toFixed(1)} ${y.toFixed(1)}Z`) };
  const next=()=>{ qa.querySelectorAll('button').forEach(x=>x.classList.remove('right','wrong')); const to=pickA(); ans=kind(to);
    const from=cur, s=performance.now(); const anim=t=>{ const p=Math.min(1,(t-s)/450); setArm(Math.round(from+(to-from)*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(anim); else { t0=performance.now(); live=true; raf=requestAnimationFrame(tick) } };
    raf=requestAnimationFrame(anim) };
  const tick=t=>{ const left=1-(t-t0)/6000; tb.firstChild.style.width=Math.max(0,left*100)+'%'; if(left<=0){ live=false; streak=0; st.textContent=0; qa.querySelectorAll('button').forEach(x=>{ if(x.textContent===ans) x.classList.add('right') }); setTimeout(next,1200); return } if(live) raf=requestAnimationFrame(tick) };
  qa.querySelectorAll('button').forEach(x=>x.onclick=()=>{ if(!live) return;
    if(x.textContent===ans){ live=false; x.classList.add('right'); streak++; st.textContent=streak; if(streak>(S.qd??0)){ S.qd=streak; bs.textContent=streak; save() }
      if(streak%3===0){ why.classList.remove('hide') } else setTimeout(next,700) }
    else { x.classList.remove('wrong'); void x.offsetWidth; x.classList.add('wrong'); streak=0; st.textContent=0 } });
  why.querySelector('button').onclick=()=>{ why.classList.add('hide'); next() };
  go.onclick=()=>{ cancelAnimationFrame(raf); streak=0; st.textContent=0; why.classList.add('hide'); next() };
  setArm(45);
  return ()=>cancelAnimationFrame(raf);
},
/* B4 Adverb Shot */
b=>{
  const Q=[['He runs','quick','quickly',1,' down the court.'],['Zhao Yun is a','brave','bravely',0,' hero.'],['She shoots the ball','careful','carefully',1,'.'],
    ['It is a','sunny','sunnily',0,' day for basketball.'],['The fox moves','slow','slowly',1,' through the trees.'],['Read the question','careful','carefully',1,' first.'],
    ['That was a','loud','loudly',0,' cheer!'],['Guan Yu','quick','quickly',1,' cuts the long word.']];
  b.append(h(`<div style="display:flex;gap:16px;align-items:center"><span class="score">Score: <b>0</b> / 8</span><span class="small" id="qn">1 / 8</span></div>`));
  const sb=b.lastChild.querySelector('b'), qn=b.lastChild.querySelector('#qn');
  const sent=h(`<p class="sent"></p>`); b.append(sent);
  const qa=h(`<div class="qa" style="grid-template-columns:1fr 1fr"></div>`); b.append(qa);
  const cv=h(`<canvas style="width:100%;height:28vh;display:block;margin-top:10px"></canvas>`); b.append(cv);
  const why=h(`<p class="frame hide pop" style="display:block;margin-top:10px">How do you know? <span class="small">后面是动作，还是东西？</span> <button class="btn gold" style="margin-left:10px">Next →</button></p>`); b.append(why);
  const ctx=cv.getContext('2d'); let W,H,i=0,score=0,ball=null,raf=0,first=true;
  const size=()=>{ const r=cv.getBoundingClientRect(); W=cv.width=r.width*devicePixelRatio; H=cv.height=r.height*devicePixelRatio }; size();
  const show=()=>{ const [a,x,y,k,c]=Q[i]; first=true; why.classList.add('hide'); qn.textContent=(i+1)+' / 8';
    sent.innerHTML=`${a} <span class="gap">?</span>${c}`; qa.innerHTML=''; [x,y].forEach((w,j)=>{ const bt=h(`<button>${w}</button>`);
      bt.onclick=()=>{ if(!why.classList.contains('hide')) return;
        if(j===k){ bt.classList.add('right'); sent.querySelector('.gap').textContent=w; if(first){ score++; sb.textContent=score; S.adv=score; save() } ball={t:0,make:true}; why.classList.remove('hide') }
        else { first=false; bt.classList.remove('wrong'); void bt.offsetWidth; bt.classList.add('wrong'); ball={t:0,make:false} } }; qa.append(bt) }) };
  why.querySelector('button').onclick=()=>{ i++; if(i>=Q.length){ sent.innerHTML=`🏆 ${score} / 8 — Great shooting!`; qa.innerHTML=''; why.classList.add('hide'); return } show() };
  const draw=()=>{ const d=devicePixelRatio; ctx.clearRect(0,0,W,H);
    const hx=W*.8, hy=H*.3; ctx.fillStyle='#fff'; ctx.fillRect(hx+W*.05,H*.05,5*d,H*.9);
    ctx.strokeStyle='#FF8A3D'; ctx.lineWidth=5*d; ctx.beginPath(); ctx.moveTo(hx-W*.04,hy); ctx.lineTo(hx+W*.04,hy); ctx.stroke();
    let bx=W*.12, by=H*.8;
    if(ball){ ball.t+=.018; const p=Math.min(1,ball.t), tx=ball.make?hx:hx+W*.07, ty=ball.make?hy:hy-H*.05;
      bx=W*.12+(tx-W*.12)*p; by=H*.8+(ty-H*.8)*p-Math.sin(p*Math.PI)*H*.55; if(ball.make&&p>=1) by=hy+(ball.t-1)*H*2;
      if(ball.t>1.4) ball=null }
    ctx.fillStyle='#FF8A3D'; ctx.beginPath(); ctx.arc(bx,by,14*d,0,7); ctx.fill(); raf=requestAnimationFrame(draw) };
  raf=requestAnimationFrame(draw); show(); addEventListener('resize',size);
  return ()=>{ cancelAnimationFrame(raf); removeEventListener('resize',size) };
},
/* B5 Angle Replay film */
b=>{
  const STOP=[10.5,24.5,40.5,55.3], JUMP=[5.6,19.5,37.5,49.8], NAMES=['Straight 平角','Right 直角','Obtuse 钝角','Acute 锐角'];
  const v=h(`<video class="film" src="2026-11-01_角度回放短片.mp4" controls playsinline preload="auto"></video>`); b.append(v);
  const bar=h(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px"><button class="btn gold">▶ / ❚❚</button><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked> 倒计时自动暂停</label><span class="small">跳到定格：</span>${[1,2,3,4].map(n=>`<button class="btn" data-j="${n-1}">${n}</button>`).join('')}</div>`); b.append(bar);
  const said=S.filmSaid||[0,0,0,0];
  const row=h(`<div style="margin-top:14px"><p class="q" style="font-size:22px">He said it himself 自己说对了：<b class="score"><b>${said.filter(Boolean).length}</b> / 4</b></p><div class="qa" style="grid-template-columns:repeat(4,1fr)">${NAMES.map((n,i)=>`<button class="fzb${said[i]?' got':''}" data-k="${i}">${n}</button>`).join('')}</div></div>`); b.append(row);
  const auto=bar.querySelector('input'), done=new Set(); let raf=0;
  bar.children[0].onclick=()=>{ v.paused?v.play():v.pause() };
  bar.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.j; v.currentTime=JUMP[i]; for(let k=i;k<4;k++) done.delete(k); v.play() });
  v.addEventListener('seeked',()=>STOP.forEach((t,i)=>{ if(v.currentTime<t-.05) done.delete(i) }));
  const tick=()=>{ if(auto.checked&&!v.paused) STOP.forEach((t,i)=>{ if(!done.has(i)&&v.currentTime>=t&&v.currentTime<t+.6){ done.add(i); v.pause() } }); raf=requestAnimationFrame(tick) };
  raf=requestAnimationFrame(tick);
  row.querySelectorAll('.fzb').forEach(x=>x.onclick=()=>{ const i=+x.dataset.k; said[i]=said[i]?0:1; x.classList.toggle('got',!!said[i]); S.filmSaid=said; save(); row.querySelector('b b').textContent=said.filter(Boolean).length });
  return ()=>{ cancelAnimationFrame(raf); v.pause() };
}
];
